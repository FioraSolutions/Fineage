# Vendored L2TerrainExtractor fatJar — path-filtered so unrelated PRs do not hit Maven Central.

name: l2-terrain-extractor

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "tools/interlude/**"
      - "scripts/check-l2-terrain-extractor.py"
      - ".github/workflows/l2-terrain-extractor.yml"
  push:
    branches: ["feat/**", "fix/**", "chore/**"]
    paths:
      - "tools/interlude/**"
      - "scripts/check-l2-terrain-extractor.py"
      - ".github/workflows/l2-terrain-extractor.yml"
  workflow_dispatch:

concurrency:
  group: l2-terrain-extractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fatjar:
    name: l2-terrain-extractor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build vendored L2TerrainExtractor (fatJar)
        run: python3 scripts/check-l2-terrain-extractor.py