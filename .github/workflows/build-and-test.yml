name: build-and-test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: ['feat/**', 'fix/**', 'chore/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out Backend (Net contract source of truth)
        uses: actions/checkout@v4
        with:
          repository: FioraSolutions/Fineage-Backend
          path: Fineage-Backend
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check IncomingPacketActions stays deleted (#142)
        run: python3 scripts/check-frozen-incoming-packet-actions.py

      - name: Check frozen Net domain maps stay deleted (C1)
        run: python3 scripts/check-frozen-net-domain-maps.py

      - name: Check Zone→client opcodes have NetZoneDispatch cases
        run: python3 scripts/check-net-zone-inbound-opcodes.py

      - name: Check playtest release helpers
        run: |
          python3 scripts/check-release-secrets.py --self-test
          python3 scripts/bake-playtest-endpoint.py --self-test
          python3 scripts/release-notes.py --self-test
          python3 scripts/pack-client.py --self-test

      - name: Check client asmdef layout (#139)
        run: python3 scripts/check-client-asmdef-layout.py

      - name: Check Net contract is in sync with the backend
        run: |
          FINEAGE_REQUIRE_CONTRACT_SYNC=1 python3 scripts/sync-net-contract.py --check \
            --backend "$GITHUB_WORKSPACE/Fineage-Backend/src/Fineage.Net.Contract" \
            --ref ''

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/Fineage.Tools.sln

      - name: Build
        run: dotnet build tools/Fineage.Tools.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tools/Fineage.Tools.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  # Advisory only — not a required status check. Pre-existing tool code has
  # whitespace drift; continue-on-error keeps the PR gate on build-and-test.
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format tools/Fineage.Tools.sln --verify-no-changes --verbosity diagnostic
