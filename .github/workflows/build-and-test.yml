name: build-and-test

# Full gate on push to dev/main only — not on PRs (use pr-sanity.yml for PR → dev).
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "l2-unity/docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out Backend (Net contract source of truth)
        uses: actions/checkout@v4
        with:
          repository: FioraSolutions/Fineage-Backend
          path: Fineage-Backend
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check character clips have no redundant Euler rotation curves
        run: python3 scripts/check-anim-rotation-hygiene.py

      - name: Check IncomingPacketActions stays deleted (#142)
        run: python3 scripts/check-frozen-incoming-packet-actions.py

      - name: Check frozen Net domain maps stay deleted (C1)
        run: python3 scripts/check-frozen-net-domain-maps.py

      - name: Check Zone→client opcodes have NetZoneDispatch cases
        run: python3 scripts/check-net-zone-inbound-opcodes.py

      - name: Check playtest release helpers
        run: |
          python3 scripts/check-release-secrets.py --self-test
          python3 scripts/bake-playtest-endpoint.py --self-test
          python3 scripts/release-notes.py --self-test
          python3 scripts/pack-client.py --self-test

      - name: Check client asmdef layout (#139)
        run: python3 scripts/check-client-asmdef-layout.py

      - name: Check Unity .meta guid format and uniqueness
        run: python3 scripts/check-unity-meta-guids.py

      - name: Check Interlude window layout matches extracted docs
        run: python3 scripts/check-interlude-window-layout.py

      - name: Unity EditMode / C#9 static guards
        run: python3 scripts/check-unity-editmode-guards.py

      - name: Install ffprobe for audio import policy duration checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check texture and audio import policy (.meta)
        run: python3 scripts/check-asset-import-policy.py

      - name: Check NPC/monster meter scale contract (#1473)
        run: python3 scripts/check-npc-monster-meter-contract.py

      - name: Check LineageWeapons mesh topology (no cardboard sheets)
        run: python3 scripts/check-weapon-mesh-topology.py

      - name: Check Elven Village BSP CSG fixtures
        run: python3 scripts/check-elven-bsp-csg-fixtures.py

      - name: Audit actor alpha-tested materials (no opaque t01/bh)
        run: python3 scripts/audit-actor-alpha-materials.py

      - name: Check paperdoll armor uses ActorModulate2X (not ActorEnvAdd)
        run: python3 scripts/check-paperdoll-armor-shader.py

      - name: Check Net contract is in sync with the backend
        run: |
          FINEAGE_REQUIRE_CONTRACT_SYNC=1 python3 scripts/sync-net-contract.py --check \
            --backend "$GITHUB_WORKSPACE/Fineage-Backend/src/Fineage.Net.Contract" \
            --ref ''

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/Fineage.Tools.sln

      - name: Build
        run: dotnet build tools/Fineage.Tools.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tools/Fineage.Tools.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  # Advisory only — not a required status check. Pre-existing tool code has
  # whitespace drift; continue-on-error keeps the PR gate on build-and-test.
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format tools/Fineage.Tools.sln --verify-no-changes --verbosity diagnostic
