name: build-and-test

# Full suite on push to dev/main. PR → dev: seconds-long stub (legacy required check name).
# Real PR gate is pr-sanity.yml.
on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "l2-unity/docs/**"
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "l2-unity/docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-pr-stub:
    name: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fineage.EditModeTests asmdef reachability (Unity compile parity)
        run: python3 scripts/check-unity-editmode-guards.py

      - run: |
          echo "PR gate is pr-sanity; full build-and-test runs on push to dev/main."
          echo "Drop this stub from branch protection when Nikita switches required checks."

  build-and-test:
    name: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out Backend (Net contract source of truth)
        uses: actions/checkout@v4
        with:
          repository: FioraSolutions/Fineage-Backend
          path: Fineage-Backend
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffprobe for audio import policy duration checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Client guards (shared with pr-sanity)
        run: bash scripts/ci-client-guards.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/Fineage.Tools.sln

      - name: Build
        run: dotnet build tools/Fineage.Tools.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tools/Fineage.Tools.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  # Advisory only — not a required status check. Pre-existing tool code has
  # whitespace drift; continue-on-error keeps the PR gate on build-and-test.
  format-check:
    name: format-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format tools/Fineage.Tools.sln --verify-no-changes --verbosity diagnostic