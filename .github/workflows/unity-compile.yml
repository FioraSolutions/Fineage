# Unity batchmode compile + EditMode smoke for PRs (#737 / #131).
# Uses the same Personal seat activation as release-clients (UNITY_EMAIL + UNITY_PASSWORD).
# Path-filtered to Scripts/Tests so we do not burn a seat on doc-only PRs.

name: unity-compile

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "l2-unity/Assets/Scripts/**"
      - "l2-unity/Assets/Tests/**"
      - "l2-unity/Packages/**"
      - "l2-unity/ProjectSettings/ProjectVersion.txt"
      - ".github/workflows/unity-compile.yml"

concurrency:
  group: unity-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: unity-editmode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Require Unity Personal secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "UNITY_EMAIL / UNITY_PASSWORD secrets are required for #737 Unity PR compile."
            exit 1
          fi

      - name: Unity EditMode (compiles Scripts)
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          # Same CLI pin as release-clients / unity-builder v6 Personal seat path.
          cliVersion: v0.1.72
          projectPath: l2-unity
          unityVersion: auto
          testMode: editmode
          # Do not set coverageEnabled: false — unity-test-runner@v4.4.0 maps that to
          # --no-coverageEnabled, which game-ci/cli v0.1.72 rejects as unknown and exits 1
          # before Docker starts. Default (true) keeps the CLI happy; coverage noise is OK
          # for this Scripts compile smoke.
          checkName: Unity EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: |
            artifacts/**
            **/TestResults-*.xml
          if-no-files-found: ignore
          retention-days: 14
