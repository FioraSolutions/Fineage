# Unity batchmode compile + EditMode (#737 / #131). Not on PRs (org runner / seat backlog per #1676).
# Push dev → fast EditMode (!Slow), red check on the commit; concurrency cancels stale dev runs.
# Push main + nightly 01:00 UTC + workflow_dispatch → full EditMode suite.
# Requires UNITY_EMAIL + UNITY_PASSWORD (Personal seat). Library cache: manifest, version, asmdef hash.

name: unity-compile

on:
  push:
    branches: [dev, main]
    paths:
      - "l2-unity/**"
      - ".github/workflows/unity-compile.yml"
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: unity-editmode
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Hash asmdef set for Library cache
        id: asmdef
        run: |
          set -euo pipefail
          hash=$(find l2-unity/Assets -name '*.asmdef' -print | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: l2-unity/Library
          key: unity-library-${{ hashFiles('l2-unity/Packages/manifest.json', 'l2-unity/ProjectSettings/ProjectVersion.txt') }}-${{ steps.asmdef.outputs.hash }}
          restore-keys: |
            unity-library-${{ hashFiles('l2-unity/Packages/manifest.json', 'l2-unity/ProjectSettings/ProjectVersion.txt') }}-
            unity-library-

      - name: Require Unity Personal secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD repo secrets are required for unity-compile (same Personal seat as release-clients). Add them in GitHub Settings → Secrets → Actions."
            exit 1
          fi

      - name: Unity EditMode (compiles Scripts + EditMode suite)
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          cliVersion: v0.1.72
          projectPath: l2-unity
          unityVersion: auto
          testMode: editmode
          testFilter: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' && '!Slow' || '' }}
          checkName: Unity EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: |
            artifacts/**
            **/TestResults-*.xml
          if-no-files-found: ignore
          retention-days: 14