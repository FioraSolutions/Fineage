# Playtest clients for the one shared public dev server.
# Triggers:
#   - push to main → prerelease tag playtest-<version>
#   - tag vX.Y.Z (no hyphen) → stable release, releases/latest
#   - tag vX.Y.Z-* or playtest-* → prerelease on that tag
#   - workflow_dispatch, once this file is on the default branch (main)
# A playtest-* or v* tag runs this file from the tagged commit, so the first
# client can be published before the workflow exists on main.
# Personal activation is UNITY_EMAIL + UNITY_PASSWORD via game-ci/unity-builder v6.
# Host defaults: fineage.evpoint.by, login.fineage.evpoint.by:2106, game.fineage.evpoint.by:7777.
# See Docs/PLAYTEST_RELEASE.md.

name: release-clients

on:
  push:
    branches: [main]
    tags: ["v*", "playtest-*"]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          full — Win + release + Linux + macOS (default).
          macos-only — rebuild Fineage-macOS.zip and attach to an existing release (no Windows/Linux).
        required: false
        type: choice
        options:
          - full
          - macos-only
        default: full
      release_tag:
        description: >-
          For macos-only — GitHub release tag to attach to (e.g. playtest-0.0.3).
          Empty uses the newest playtest-X.Y.Z tag in the repo.
        required: false
        type: string
      public_host:
        description: Override landing host (default fineage.evpoint.by)
        required: false
        type: string
      login_host:
        description: Override login host (default login.fineage.evpoint.by)
        required: false
        type: string
      game_host:
        description: Override game host (default game.fineage.evpoint.by)
        required: false
        type: string
      login_port:
        description: Override login TCP port (default 2106)
        required: false
        type: string
      game_port:
        description: Override game TCP port (default 7777)
        required: false
        type: string
      create_release:
        description: Publish a GitHub Release (full mode only)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: release-clients
  # Do not cancel in-progress runs: publish creates the GitHub Release (Windows
  # only) before macOS/Linux finish; cancellation mid-run leaves prereleases
  # with a single zip. Overlapping runs are possible if main is pushed again
  # before the prior run finishes — rare, and each run still serializes Unity
  # (max-parallel: 1) so at worst two Personal seats briefly contend.
  cancel-in-progress: false

jobs:
  prepare:
    name: version and secrets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      unity_version: ${{ steps.notes.outputs.unity_version }}
      release_tag: ${{ steps.notes.outputs.release_tag }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check Unity license and playtest host
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          FINEAGE_PUBLIC_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.public_host || secrets.FINEAGE_PUBLIC_HOST }}
          FINEAGE_LOGIN_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.login_host || secrets.FINEAGE_LOGIN_HOST }}
          FINEAGE_GAME_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.game_host || secrets.FINEAGE_GAME_HOST }}
        run: python3 scripts/check-release-secrets.py

      - name: Version and changelog
        id: notes
        env:
          FINEAGE_PUBLIC_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.public_host || secrets.FINEAGE_PUBLIC_HOST }}
          FINEAGE_LOGIN_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.login_host || secrets.FINEAGE_LOGIN_HOST }}
          FINEAGE_GAME_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.game_host || secrets.FINEAGE_GAME_HOST }}
          FINEAGE_LOGIN_PORT: ${{ github.event_name == 'workflow_dispatch' && inputs.login_port || secrets.FINEAGE_LOGIN_PORT }}
          FINEAGE_GAME_PORT: ${{ github.event_name == 'workflow_dispatch' && inputs.game_port || secrets.FINEAGE_GAME_PORT }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          RELEASE_ATTACH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          RELEASE_BUILT_AT: ${{ github.run_started_at }}
        run: python3 scripts/release-notes.py --output dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            dist/CHANGELOG.md
            dist/version.json
          retention-days: 90

  build-windows:
    name: Fineage-Windows-x64
    needs: prepare
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup /opt/hostedtoolcache || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-playtest-client
        with:
          targetPlatform: StandaloneWindows64
          artifact: Fineage-Windows-x64
          unityVersion: ${{ needs.prepare.outputs.unity_version }}
          publicHost: ${{ github.event_name == 'workflow_dispatch' && inputs.public_host || secrets.FINEAGE_PUBLIC_HOST }}
          loginHost: ${{ github.event_name == 'workflow_dispatch' && inputs.login_host || secrets.FINEAGE_LOGIN_HOST }}
          gameHost: ${{ github.event_name == 'workflow_dispatch' && inputs.game_host || secrets.FINEAGE_GAME_HOST }}
          loginPort: ${{ github.event_name == 'workflow_dispatch' && inputs.login_port || secrets.FINEAGE_LOGIN_PORT }}
          gamePort: ${{ github.event_name == 'workflow_dispatch' && inputs.game_port || secrets.FINEAGE_GAME_PORT }}
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unitySerial: ${{ secrets.UNITY_SERIAL }}

  publish:
    name: GitHub Release
    needs: [prepare, build-windows]
    if: >-
      needs.prepare.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'full') &&
      (github.event_name != 'workflow_dispatch' || inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fineage-Windows-x64
          path: artifacts/Fineage-Windows-x64

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: artifacts/notes

      - name: Require the Windows zip
        run: test -f artifacts/Fineage-Windows-x64/Fineage-Windows-x64.zip

      - name: Publish GitHub release (gh CLI, idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Fineage $VERSION" --notes-file artifacts/notes/CHANGELOG.md --draft=false "${flags[@]}"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Fineage $VERSION" --notes-file artifacts/notes/CHANGELOG.md "${flags[@]}"
          fi
          gh release upload "$TAG" --clobber \
            artifacts/Fineage-Windows-x64/Fineage-Windows-x64.zip \
            artifacts/notes/CHANGELOG.md \
            artifacts/notes/version.json

  build-linux:
    name: Fineage-Linux-x64
    needs: [prepare, build-windows, publish]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup /opt/hostedtoolcache || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-playtest-client
        with:
          targetPlatform: StandaloneLinux64
          artifact: Fineage-Linux-x64
          unityVersion: ${{ needs.prepare.outputs.unity_version }}
          publicHost: ${{ github.event_name == 'workflow_dispatch' && inputs.public_host || secrets.FINEAGE_PUBLIC_HOST }}
          loginHost: ${{ github.event_name == 'workflow_dispatch' && inputs.login_host || secrets.FINEAGE_LOGIN_HOST }}
          gameHost: ${{ github.event_name == 'workflow_dispatch' && inputs.game_host || secrets.FINEAGE_GAME_HOST }}
          loginPort: ${{ github.event_name == 'workflow_dispatch' && inputs.login_port || secrets.FINEAGE_LOGIN_PORT }}
          gamePort: ${{ github.event_name == 'workflow_dispatch' && inputs.game_port || secrets.FINEAGE_GAME_PORT }}
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unitySerial: ${{ secrets.UNITY_SERIAL }}

  build-macos:
    name: Fineage-macOS
    needs: [prepare, build-windows, publish, build-linux]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        (
          needs.build-windows.result == 'success' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
          (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
          (github.event_name != 'workflow_dispatch' || inputs.mode == 'full')
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.mode == 'macos-only'
        )
      )
    runs-on: macos-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-playtest-client
        with:
          targetPlatform: StandaloneOSX
          artifact: Fineage-macOS
          unityVersion: ${{ needs.prepare.outputs.unity_version }}
          publicHost: ${{ github.event_name == 'workflow_dispatch' && inputs.public_host || secrets.FINEAGE_PUBLIC_HOST }}
          loginHost: ${{ github.event_name == 'workflow_dispatch' && inputs.login_host || secrets.FINEAGE_LOGIN_HOST }}
          gameHost: ${{ github.event_name == 'workflow_dispatch' && inputs.game_host || secrets.FINEAGE_GAME_HOST }}
          loginPort: ${{ github.event_name == 'workflow_dispatch' && inputs.login_port || secrets.FINEAGE_LOGIN_PORT }}
          gamePort: ${{ github.event_name == 'workflow_dispatch' && inputs.game_port || secrets.FINEAGE_GAME_PORT }}
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unitySerial: ${{ secrets.UNITY_SERIAL }}

  build-macos-retry:
    name: Fineage-macOS (runner retry)
    needs: [prepare, build-macos]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-macos.result != 'success' &&
      needs.build-macos.result != 'skipped'
    runs-on: macos-14
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-playtest-client
        with:
          targetPlatform: StandaloneOSX
          artifact: Fineage-macOS
          unityVersion: ${{ needs.prepare.outputs.unity_version }}
          publicHost: ${{ github.event_name == 'workflow_dispatch' && inputs.public_host || secrets.FINEAGE_PUBLIC_HOST }}
          loginHost: ${{ github.event_name == 'workflow_dispatch' && inputs.login_host || secrets.FINEAGE_LOGIN_HOST }}
          gameHost: ${{ github.event_name == 'workflow_dispatch' && inputs.game_host || secrets.FINEAGE_GAME_HOST }}
          loginPort: ${{ github.event_name == 'workflow_dispatch' && inputs.login_port || secrets.FINEAGE_LOGIN_PORT }}
          gamePort: ${{ github.event_name == 'workflow_dispatch' && inputs.game_port || secrets.FINEAGE_GAME_PORT }}
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unitySerial: ${{ secrets.UNITY_SERIAL }}

  attach:
    name: Attach macOS and Linux
    needs: [prepare, publish, build-linux, build-macos, build-macos-retry]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.publish.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.mode == 'macos-only' &&
          (needs.build-macos.result == 'success' || needs.build-macos-retry.result == 'success')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Fineage-*

      - name: Collect extra client zips
        id: extras
        run: |
          shopt -s nullglob globstar
          mkdir -p attach
          found=0
          for name in Fineage-macOS.zip Fineage-Linux-x64.zip; do
            for path in artifacts/**/"$name"; do
              if [ -f "$path" ]; then
                cp -f "$path" "attach/$name"
                found=1
                break
              fi
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No macOS or Linux zip to attach. The Windows release is unchanged."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          ls -la attach/

      - name: Attach extra client zips (gh CLI)
        if: steps.extras.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release upload "$TAG" --clobber attach/*.zip
